name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Jest + Supertest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aspge.org.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aspge.org.br/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          # Evita baixar o Chromium do puppeteer (não usado nos testes)
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test
