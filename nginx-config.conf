server {
    server_name aspgepa.org.br www.aspgepa.org.br;

    client_max_body_size 10M;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads {
        alias /var/www/aspge/app/public/uploads;
        expires 30d;
        add_header Cache-Control 'public, immutable';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aspgepa.org.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aspgepa.org.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.aspgepa.org.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aspgepa.org.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name aspgepa.org.br www.aspgepa.org.br;
    return 404; # managed by Certbot




}